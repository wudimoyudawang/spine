<svg width="680" height="510" viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
  <rect width="680" height="510" fill="#FFFFFF"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#1F2329">个人计划中枢 · 技术架构</text>
  <text x="656" y="30" font-size="11" fill="#8A9099" text-anchor="end">Local-first</text>

  <rect x="180" y="56" width="152" height="40" rx="8" fill="#F5F8FF" stroke="#D6E4FF"/>
  <text x="256" y="81" font-size="12" fill="#245BDB" text-anchor="middle">手机 PWA</text>
  <rect x="348" y="56" width="152" height="40" rx="8" fill="#F5F8FF" stroke="#D6E4FF"/>
  <text x="424" y="81" font-size="12" fill="#245BDB" text-anchor="middle">电脑浏览器</text>

  <g stroke="#C9CDD4" stroke-width="1.5" fill="none">
    <line x1="256" y1="96" x2="256" y2="112"/>
    <line x1="424" y1="96" x2="424" y2="112"/>
  </g>

  <rect x="180" y="112" width="320" height="44" rx="8" fill="#F5F8FF" stroke="#D6E4FF"/>
  <text x="200" y="139" font-size="12" fill="#1F2329">React + TypeScript 前端（PWA）</text>

  <line x1="340" y1="156" x2="340" y2="176" stroke="#C9CDD4" stroke-width="1.5"/>

  <rect x="180" y="176" width="320" height="44" rx="8" fill="#F3FBF6" stroke="#C9EBD8"/>
  <text x="200" y="203" font-size="12" fill="#1F2329">IndexedDB 本地存储</text>

  <text x="516" y="192" font-size="11" font-weight="700" fill="#1A7F45">主路径</text>
  <text x="516" y="209" font-size="11" fill="#646A73">不登录也完整可用</text>

  <line x1="340" y1="220" x2="340" y2="272" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="340,280 335,270 345,270" fill="#C9CDD4"/>
  <text x="352" y="250" font-size="11" fill="#B77400">登录后才启用</text>

  <rect x="180" y="272" width="320" height="56" rx="8" fill="#FFF8EE" stroke="#FFE0B8"/>
  <text x="200" y="296" font-size="12" fill="#1F2329">Docker 容器 · Node + Fastify</text>
  <text x="200" y="315" font-size="11.5" fill="#646A73">账号鉴权 + 增量同步 API</text>

  <text x="516" y="296" font-size="11" font-weight="700" fill="#B77400">一键启动</text>
  <text x="516" y="313" font-size="11" fill="#646A73">docker compose up</text>

  <line x1="340" y1="328" x2="340" y2="360" stroke="#C9CDD4" stroke-width="1.5"/>
  <polygon points="340,368 335,358 345,358" fill="#C9CDD4"/>

  <rect x="180" y="360" width="320" height="48" rx="8" fill="#F6F2FF" stroke="#E0D4FF"/>
  <text x="200" y="389" font-size="12" fill="#1F2329">/data 卷 · SQLite 文件 + 导出文件</text>

  <text x="516" y="380" font-size="11" fill="#646A73">挂到 NAS</text>
  <text x="516" y="397" font-size="11" fill="#646A73">存储盘</text>

  <line x1="340" y1="408" x2="340" y2="428" stroke="#C9CDD4" stroke-width="1.5"/>
  <polygon points="340,436 335,426 345,426" fill="#C9CDD4"/>

  <rect x="180" y="428" width="320" height="40" rx="8" fill="#F7F8FA" stroke="#E5E7EB"/>
  <text x="200" y="453" font-size="12" fill="#40454D">飞牛 NAS · 内网穿透 · HTTPS</text>

  <text x="516" y="444" font-size="11" fill="#646A73">对外访问</text>
  <text x="516" y="461" font-size="11" fill="#D54941">必须挂 HTTPS</text>
</svg>
