[package]
name = "spine-planner"
version = "0.1.0"
description = "个人计划中枢桌面版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
